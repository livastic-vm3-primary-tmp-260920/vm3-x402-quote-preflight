    name: vm3-original-x402-quote-preflight
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
